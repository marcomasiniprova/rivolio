# Senza questo file, un deploy via API (zip) viene pubblicato com'è,
# senza build: sorgenti serviti come statici e home 404 (successo il 7/08).
# E senza il plugin dichiarato, la build gira ma pubblica la cartella
# .next cruda, senza il server: il plugin va nominato, non è automatico
# sui deploy via zip.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
